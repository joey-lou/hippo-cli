[package]
name = "hippo-cli"
version = "0.0.0-dev"
edition = "2021"
rust-version = "1.89"
description = "Hippo personal memory CLI. The command is `hippo`."
license = "MIT"
repository = "https://github.com/joey-lou/hippo"
homepage = "https://github.com/joey-lou/hippo"
readme = "README.md"
keywords = ["memory", "markdown", "cli", "search"]
categories = ["command-line-utilities"]

[[bin]]
name = "hippo"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
include_dir = "0.7"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
toml = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
